<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Server Load Predictor</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/ui/static/app.css" rel="stylesheet">
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <style>
        .sparkline { width: 100%; height: 50px; overflow: hidden; }
        .node-card-body { padding: 1rem; }
        .metric-value { font-size: 1.1rem; font-weight: 700; }
        .metric-label { font-size: 0.7rem; color: #6c757d; text-transform: uppercase; letter-spacing: 0.05em; }
        .node-name { font-size: 1.1rem; font-weight: 700; margin: 0; color: #212529; }
        .pred-label { font-size: 0.6rem; color: #adb5bd; }
    </style>
</head>
<body>

<div class="container-fluid main-container" x-data="dashboard()">
    <div class="row details-header align-items-center mb-4">
        <div class="col d-flex align-items-center">
            <h1 class="h2 fw-bold m-0">Server Fleet Dashboard</h1>
            <span class="badge ms-3" :class="wsConnected ? 'text-bg-success' : 'text-bg-danger'" x-text="wsStatus"></span>
        </div>
    </div>

    <div class="row row-cols-1 row-cols-md-2 row-cols-xl-3 g-4">
        <template x-for="node in nodes" :key="node.id">
            <div class="col">
                <a :href="'/ui/nodes/' + node.id" class="card node-card h-100 text-decoration-none">
                    <div class="node-card-header d-flex justify-content-between align-items-center">
                        <h2 class="node-name text-truncate" x-text="node.name"></h2>
                        <span class="status-badge" :class="node.risk === 'CRITICAL' ? 'status-critical' : 'status-safe'" x-text="node.risk"></span>
                    </div>
                    <div class="node-card-body">
                        <div class="row mb-2">
                            <div class="col-6 border-end">
                                <div class="metric-label d-flex align-items-center gap-1">
                                    <span>CPU</span>
                                    <i style="display: block; width: 5px; height: 5px; border-radius: 2px; background-color: #0d6efd;"></i>
                                </div>
                                <div class="metric-value d-flex align-items-center flex-nowrap gap-1">
                                    <div class="current-value text-body" x-text="node.cpu.toFixed(0) + '%'"></div>
                                    <div> → </div>
                                    <div class="pred-value text-muted fw-normal"><span x-text="node.cpu_pred_lower.toFixed(0) + '-' + node.cpu_pred_upper.toFixed(0) + '%'"></span></div>
                                </div>
                            </div>
                            <div class="col-6">
                                <div class="metric-label d-flex align-items-center gap-1">
                                    <span>RAM</span>
                                    <i style="display: block; width: 5px; height: 5px; border-radius: 2px; background-color: #6f42c1;"></i>
                                </div>
                                <div class="metric-value d-flex align-items-center flex-nowrap gap-1">
                                    <div class="current-value text-body" x-text="node.ram.toFixed(0) + '%'"></div>
                                    <div> → </div>
                                    <div class="pred-value text-muted fw-normal"><span x-text="node.ram_pred_lower.toFixed(0) + '-' + node.ram_pred_upper.toFixed(0) + '%'"></span></div>
                                </div>
                            </div>
                        </div>
                        <div class="text-center mb-1 small">
                            <small class="text-muted">Horizon: <span x-text="node.horizon"></span>m</small>
                        </div>
                        <div class="sparkline" :id="'spark-' + node.id" x-init="initSparkline($el, node)"></div>
                    </div>
                </a>
            </div>
        </template>
        <template x-if="nodes.length === 0">
            <div class="col-12">
                <div class="alert alert-secondary">No nodes with available forecast.</div>
            </div>
        </template>
    </div>
</div>

<script>
function dashboard() {
    return {
        nodes: JSON.parse('{{.InitialNodesJSON}}'),
        wsConnected: false,
        wsStatus: 'WS: connecting...',
        
        init() {
            this.connectWebSocket();
            window.addEventListener('resize', () => this.redrawAllSparklines());
        },

        async connectWebSocket() {
            const protocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
            const ws = new WebSocket(`${protocol}//${location.host}/ws?interval_sec=2`);
            
            ws.onopen = () => {
                this.wsConnected = true;
                this.wsStatus = 'WS: live';
            };
            ws.onclose = () => {
                this.wsConnected = false;
                this.wsStatus = 'WS: closed';
                setTimeout(() => this.connectWebSocket(), 3000);
            };
            ws.onerror = () => {
                this.wsStatus = 'WS: error';
            };
            
            ws.onmessage = (ev) => {
                const data = JSON.parse(ev.data);
                if (Array.isArray(data)) {
                    data.forEach(n => {
                        const idx = this.nodes.findIndex(node => node.id === n.id);
                        if (idx >= 0) {
                            this.nodes[idx] = { ...this.nodes[idx], ...n };
                            const el = document.getElementById('spark-' + n.id);
                            if (el) this.redrawSparkline(el, this.nodes[idx]);
                        } else {
                            this.nodes.push(n);
                        }
                    });
                }
            };
        },

        initSparkline(el, node) {
            let data = [];
            try {
                data = typeof node.spark_json === 'string' ? JSON.parse(node.spark_json) : (node.sparkData || []);
            } catch(e) { data = []; }
            if (!data || data.length < 2) return;

            el.dataset.nodeId = node.id;
            this.drawSparkline(el, data);
        },

        drawSparkline(el, data) {
            const width = el.clientWidth || el.offsetWidth || 100;
            const height = 50;

            d3.select(el).selectAll('*').remove();

            const parsed = data.map(d => ({ timestamp: new Date(d.timestamp), cpu: d.cpu, ram: d.ram }));
            const x = d3.scaleTime().domain(d3.extent(parsed, d => d.timestamp)).range([0, width]);
            const y = d3.scaleLinear().domain([0, 100]).range([height, 0]);

            const svg = d3.select(el).append('svg').attr('width', width).attr('height', height)
                .attr('viewBox', `0 0 ${width} ${height}`);
            
            const cpuLine = d3.line().x(d => x(d.timestamp)).y(d => y(d.cpu)).curve(d3.curveMonotoneX);
            const ramLine = d3.line().x(d => x(d.timestamp)).y(d => y(d.ram)).curve(d3.curveMonotoneX);

            svg.append('path').datum(parsed).attr('fill', 'none').attr('stroke', '#0d6efd').attr('stroke-width', 2).attr('d', cpuLine);
            svg.append('path').datum(parsed).attr('fill', 'none').attr('stroke', '#6f42c1').attr('stroke-width', 2).attr('d', ramLine);
        },

        redrawSparkline(el, node) {
            let data = [];
            try {
                data = typeof node.spark_json === 'string' ? JSON.parse(node.spark_json) : (node.sparkData || []);
            } catch(e) { data = []; }
            if (data.length < 2) return;
            this.drawSparkline(el, data);
        },

        redrawAllSparklines() {
            this.nodes.forEach(node => {
                const el = document.getElementById('spark-' + node.id);
                if (el) this.redrawSparkline(el, node);
            });
        }
    };
}
</script>
</body>
</html>
