<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Node {{.NodeName}} - AI Predictor</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/ui/static/app.css" rel="stylesheet">
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <script src="https://d3js.org/d3.v7.min.js"></script>
</head>
<body>

<div class="container-fluid main-container"
     x-data="nodeDetails()"
     x-init="init()"
     @ws-status.window="wsConnected = $event.detail.connected; wsStatus = $event.detail.status"
     @ws-message.window="handleWsMessage($event.detail)">

    <div class="row details-header align-items-center mb-4">
        <div class="col-auto">
            <a href="/ui" class="btn btn-outline-secondary btn-sm">← Back</a>
        </div>
        <div class="col">
            <h1 class="h2 fw-bold m-0 d-inline-block me-3">
                Node: <span x-text="nodeName"></span>
            </h1>
            <span class="status-badge" :class="risk === 'CRITICAL' ? 'status-critical' : 'status-safe'" x-text="risk"></span>
            <span class="badge ms-2" :class="wsConnected ? 'text-bg-success' : 'text-bg-danger'" x-text="wsStatus"></span>
        </div>
    </div>

    <div class="row">
        <div class="col-xl-4">
            <div class="hardware-config">
                <div class="d-flex justify-content-between align-items-center">
                    <div class="usage-label m-0">Hardware Configuration</div>
                    <button class="btn btn-sm btn-outline-primary" data-bs-toggle="modal" data-bs-target="#editNodeModal">Edit</button>
                </div>
                <div class="fw-bold text-dark">
                    <span x-text="cpuCores.toFixed(1)"></span> Cores | <span x-text="ramGB.toFixed(1)"></span> GB RAM
                </div>
                <div class="small text-muted mt-1">Safe Boundary: <span x-text="safeBoundary"></span>%</div>
            </div>

            <div class="modal fade" id="editNodeModal" tabindex="-1" aria-labelledby="editNodeModalLabel" aria-hidden="true">
                <div class="modal-dialog">
                    <div class="modal-content">
                        <div class="modal-header">
                            <h5 class="modal-title">Edit Node: <span x-text="nodeName"></span></h5>
                            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                        </div>
                        <div class="modal-body">
                            <form @submit.prevent="saveNode">
                                <div class="mb-3">
                                    <label class="form-label">Name</label>
                                    <input type="text" class="form-control" x-model="editForm.name">
                                </div>
                                <div class="mb-3">
                                    <label class="form-label">CPU Cores</label>
                                    <input type="number" class="form-control" x-model="editForm.cpu_cores" step="0.5" min="0.5">
                                </div>
                                <div class="mb-3">
                                    <label class="form-label">RAM (GB)</label>
                                    <input type="number" class="form-control" x-model="editForm.ram_gb" step="0.1" min="0.1">
                                </div>
                                <div class="mb-3">
                                    <label class="form-label">Safe Boundary (%)</label>
                                    <input type="number" class="form-control" x-model="editForm.safe_boundary" step="1" min="1" max="100">
                                </div>
                                <div x-show="editError" class="text-danger" x-text="editError"></div>
                            </form>
                        </div>
                        <div class="modal-footer">
                            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                            <button type="button" class="btn btn-primary" @click="saveNode">Save Changes</button>
                        </div>
                    </div>
                </div>
            </div>

            <div class="current-load-big card-flat text-center p-3 mb-3">
                <div class="usage-label">Current Load (CPU / RAM)</div>
                <span :class="risk === 'CRITICAL' ? 'text-danger' : 'text-success'" x-text="currentCPU.toFixed(1) + '%'"></span> / 
                <span class="text-secondary" x-text="currentRAM.toFixed(1) + '%'"></span>
            </div>

            <div class="card card-flat p-3 mt-3">
                <div class="usage-label mb-2">Forecast Details (<span x-text="horizon"></span>m)</div>
                <div class="d-flex justify-content-between border-bottom pb-2 mb-2">
                    <span>Predicted Peak:</span>
                    <strong x-text="upperBound.toFixed(1) + '%'"></strong>
                </div>
                <div class="d-flex justify-content-between border-bottom pb-2 mb-2">
                    <span>Lower Bound:</span>
                    <strong x-text="lowerBound.toFixed(1) + '%'"></strong>
                </div>
                <div class="d-flex justify-content-between mb-2">
                    <span>Headroom:</span>
                    <strong x-text="headroom.toFixed(1) + '%'"></strong>
                </div>
            </div>

            <div class="card card-flat p-3 mt-3">
                <div class="usage-label mb-2">Quality Metrics</div>
                <div class="d-flex justify-content-between border-bottom pb-2 mb-2">
                    <span>MAE:</span>
                    <strong x-text="qualityMAE.toFixed(3)"></strong>
                </div>
                <div class="d-flex justify-content-between">
                    <span>Coverage:
                    </span>
                    <strong>
                        <template x-if="coverageLow">
                            <span class="me-2">⚠️</span>
                        </template>
                        <span x-text="qualityCoverage.toFixed(1) + '%'"></span>
                    </strong>
                </div>
            </div>
        </div>

        <div class="col-xl-8">
            <div class="card card-flat p-4">
                <h3 class="h5 fw-bold m-0">Historical & Predicted Load (CPU)</h3>
                <div class="historical-chart-container border-0" id="node-details-chart"></div>
            </div>

            <div class="card card-flat p-4 mt-3">
                <div id="ws-log-container" class="log-container">
                    <template x-if="logs.length === 0">
                        <div class="text-muted">Waiting for data...</div>
                    </template>
                    <template x-for="log in logs" :key="log.time">
                        <div class="log-entry">
                            <span class="log-time" x-text="'[' + log.time + ']'"></span>
                            <span x-text="log.msg"></span>
                        </div>
                    </template>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
// alpine.js: only for node details and form.
function nodeDetails() {
    return {
        nodeName: '{{.NodeName}}',
        cpuCores: {{.CPUCores}},
        ramGB: {{.RAMGB}},
        safeBoundary: {{.SafeBoundary}},
        currentCPU: {{.CurrentCPU}},
        currentRAM: {{.CurrentRAM}},
        lowerBound: {{.LowerBound}},
        upperBound: {{.UpperBound}},
        headroom: {{.Headroom}},
        horizon: {{.Horizon}},
        risk: '{{.Risk}}',
        qualityMAE: {{.QualityMAE}},
        qualityCoverage: {{.QualityCoverage}},
        coverageLow: {{if .CoverageLow}}true{{else}}false{{end}},
        upperBoundExceeded: {{if .UpperBoundExceeded}}true{{else}}false{{end}},
        wsConnected: false,
        wsStatus: 'WS: connecting...',
        logs: [],
        editForm: {
            name: '{{.NodeName}}',
            cpu_cores: {{.CPUCores}},
            ram_gb: {{.RAMGB}},
            safe_boundary: {{.SafeBoundary}}
        },
        editError: '',
        saveNode() {
            // ...реализация сохранения, если нужно...
        },
        handleWsMessage(p) {
            this.currentCPU = p.cpu;
            if (p.ram !== undefined) {
                this.currentRAM = p.ram;
            }
            this.lowerBound = p.lower;
            this.upperBound = p.upper;
            this.headroom = Math.max(0, 100 - p.upper);
            
            var now = new Date();
            var timeStr = now.toLocaleTimeString();
            var msg = `CPU: ${p.cpu.toFixed(2)}%, Lower: ${p.lower.toFixed(2)}%, Upper: ${p.upper.toFixed(2)}%`;
            this.logs.unshift({ time: timeStr, msg: msg });
            if (this.logs.length > 10) {
                this.logs.pop();
            }
        },
        init() {
            // Только для AlpineJS, график отдельно
        }
    }
}
</script>
<script>
// D3 + WebSocket: только для графика и логов
(function() {
    const initialPoints = {{.ChartJSON}};
    const NODE_ID   = "{{.NodeID}}";
    const HORIZON   = {{.Horizon}};
    const SAFE_BOUNDARY = {{.SafeBoundary}};
    let chartData = initialPoints.map(d => ({
        timestamp: new Date(d.timestamp),
        cpuUsage: d.cpu,
        quantileLower: d.lower,
        quantileUpper: d.upper
    }));
    let nowTime = new Date("{{.NowISO}}"),
        margin = {top: 40, right: 30, bottom: 40, left: 50},
        container = document.getElementById("node-details-chart");
    function drawChart() {
        container = document.getElementById("node-details-chart");
        const width = container.clientWidth - margin.left - margin.right;
        const height = 350 - margin.top - margin.bottom;
        d3.select("#node-details-chart").selectAll("*").remove();
        const svg = d3.select("#node-details-chart")
          .append("svg")
          .attr("width", "100%")
          .attr("height", "100%")
          .attr("viewBox", `0 0 ${width + margin.left + margin.right} ${height + margin.top + margin.bottom}`)
          .append("g")
          .attr("transform", `translate(${margin.left},${margin.top})`);
        const gridGroup = svg.append("g").attr("class", "grid-group");
        const yScale = d3.scaleLinear().domain([-5, 110]).range([height, 0]);
        svg.append("line")
          .attr("x1", 0).attr("x2", width)
          .attr("y1", yScale(SAFE_BOUNDARY)).attr("y2", yScale(SAFE_BOUNDARY))
          .attr("stroke", "#dc3545").attr("stroke-dasharray", "4,4").attr("stroke-width", 1);

        const quantileAreaGroup = svg.append("g").attr("class", "quantile-area");
        const pathGroup = svg.append("g").attr("class", "path");
        const axesGroup = svg.append("g").attr("class", "axes");
        const markerGroup = svg.append("g").attr("class", "markers");
        const xScale = d3.scaleTime().range([0, width]);
        xScale.domain([
            new Date(nowTime.getTime() - 60 * 60 * 1000),
            new Date(nowTime.getTime() + HORIZON * 60 * 1000)
        ]);
        const lineGenerator = d3.line()
          .x(d => xScale(d.timestamp))
          .y(d => yScale(d.cpuUsage));
        const areaGenerator = d3.area()
          .x(d => xScale(d.timestamp))
          .y0(d => yScale(d.quantileLower))
          .y1(d => yScale(d.quantileUpper));
        const quantileArea = quantileAreaGroup.selectAll(".quantile-path").data([chartData]);
        quantileArea.enter().append("path").attr("class", "quantile-path")
          .merge(quantileArea)
          .attr("d", areaGenerator)
          .attr("fill", "#0d6efd")
          .attr("opacity", 0.15);
        quantileArea.exit().remove();
        const historyOnly = chartData.filter(d => d.timestamp <= nowTime);
        const historicalPath = pathGroup.selectAll(".historical-path").data([historyOnly]);
        historicalPath.enter().append("path").attr("class", "historical-path")
          .merge(historicalPath)
          .attr("d", lineGenerator)
          .attr("fill", "none")
          .attr("stroke", "#0d6efd")
          .attr("stroke-width", 2.5);
        historicalPath.exit().remove();
        const forecastOnly = chartData.filter(d => d.timestamp >= nowTime);
        const lowerLineGen = d3.line()
            .x(d => xScale(d.timestamp))
            .y(d => yScale(d.quantileLower))
            .curve(d3.curveMonotoneX);
        const upperLineGen = d3.line()
            .x(d => xScale(d.timestamp))
            .y(d => yScale(d.quantileUpper))
            .curve(d3.curveMonotoneX);
        const lowerPath = pathGroup.selectAll(".forecast-lower-path").data([forecastOnly]);
        lowerPath.enter().append("path").attr("class", "forecast-lower-path")
            .merge(lowerPath)
            .attr("d", lowerLineGen)
            .attr("fill", "none")
            .attr("stroke", "#0d6efd")
            .attr("stroke-width", 1)
            .attr("stroke-dasharray", "2,2");
        lowerPath.exit().remove();
        const upperPath = pathGroup.selectAll(".forecast-upper-path").data([forecastOnly]);
        upperPath.enter().append("path").attr("class", "forecast-upper-path")
            .merge(upperPath)
            .attr("d", upperLineGen)
            .attr("fill", "none")
            .attr("stroke", "#0d6efd")
            .attr("stroke-width", 1)
            .attr("stroke-dasharray", "2,2");
        upperPath.exit().remove();
        const xAxis = d3.axisBottom(xScale).ticks(d3.timeMinute.every(15)).tickFormat(d3.timeFormat("%H:%M"));
        const yAxis = d3.axisLeft(yScale).ticks(5);
        const yGrid = d3.axisLeft(yScale).tickSize(-width).tickFormat('').ticks(5);
        gridGroup.call(yGrid).selectAll("line").attr("stroke", "#e9ecef").attr("stroke-dasharray", "2,2");
        gridGroup.select(".domain").remove();
        axesGroup.selectAll(".x-axis").data([null]).enter().append("g").attr("class", "x-axis");
        axesGroup.selectAll(".y-axis").data([null]).enter().append("g").attr("class", "y-axis");
        axesGroup.select(".x-axis").attr("transform", `translate(0,${height})`).call(xAxis);
        axesGroup.select(".y-axis").call(yAxis);
        const nowMarker = markerGroup.selectAll(".now-marker").data([nowTime]);
        nowMarker.enter().append("line").attr("class", "now-marker")
          .attr("stroke", "#212529").attr("stroke-width", 1)
          .merge(nowMarker)
          .attr("x1", xScale(nowTime)).attr("y1", yScale(100))
          .attr("x2", xScale(nowTime)).attr("y2", yScale(0));
        const nowText = markerGroup.selectAll(".now-text").data([nowTime]);
        nowText.enter().append("text").attr("class", "now-text")
          .attr("fill", "#212529").style("font-size", "10px").style("font-weight", "600").attr("text-anchor", "middle")
          .merge(nowText)
          .attr("x", xScale(nowTime)).attr("y", height + 30)
          .text("CURRENT TIME");
    }
    drawChart();
    window.addEventListener('resize', drawChart);
    var wsProto = location.protocol === "https:" ? "wss" : "ws";
    var ws = new WebSocket(wsProto + "://" + location.host + "/ws?node_id=" + encodeURIComponent(NODE_ID) + "&interval_sec=2");
    
    ws.onopen  = function() {
        window.dispatchEvent(new CustomEvent('ws-status', { detail: { connected: true, status: 'WS: live' } }));
    };
    ws.onclose = function() {
        window.dispatchEvent(new CustomEvent('ws-status', { detail: { connected: false, status: 'WS: closed' } }));
    };
    ws.onerror = function() {
        window.dispatchEvent(new CustomEvent('ws-status', { detail: { connected: false, status: 'WS: error' } }));
    };
    ws.onmessage = function(ev) {
        var p;
        try { p = JSON.parse(ev.data); } catch(_) { return; }
        
        window.dispatchEvent(new CustomEvent('ws-message', { detail: p }));

        nowTime = new Date(p.now_iso || p.timestamp);
        chartData = chartData.filter(d => d.timestamp < nowTime);
        chartData.push({
            timestamp: nowTime,
            cpuUsage: p.cpu,
            quantileLower: p.cpu,
            quantileUpper: p.cpu
        });
        var steps = [
          { min: HORIZON / 3,     frac: 1/3 },
          { min: 2 * HORIZON / 3, frac: 2/3 },
          { min: HORIZON,          frac: 1   }
        ];
        steps.forEach(function(s) {
          chartData.push({
            timestamp: new Date(nowTime.getTime() + s.min * 60000),
            cpuUsage:   p.cpu,
            quantileLower: p.cpu + (p.lower - p.cpu) * s.frac,
            quantileUpper: p.cpu + (p.upper - p.cpu) * s.frac
          });
        });
        var cutoff = new Date(nowTime.getTime() - 65 * 60000);
        chartData = chartData.filter(d => d.timestamp > cutoff);
        
        drawChart();
    };
})();
</script>
</body>
</html>
